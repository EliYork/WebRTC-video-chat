<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'"
        />
        <title>选择共享画面</title>
        <link rel="stylesheet" href="panel.css" />
        <link rel="stylesheet" href="picker.css" />
        <script src="picker.cjs" defer></script>
    </head>
    <body>
        <header class="titlebar">
            <span>选择共享画面</span
            ><button id="close" class="close" aria-label="关闭">×</button>
        </header>
        <main>
            <h1>你想分享什么？</h1>
            <p class="intro">选择一个屏幕或窗口，确认后开始共享。</p>
            <div id="sources" aria-label="共享来源">
                <p class="empty" role="status">正在获取可用画面…</p>
            </div>
        </main>
        <footer class="picker-footer">
            <label><input id="audio" type="checkbox" />同时共享系统声音</label>
            <p id="audio-note">系统声音可能包含通话声音，可按需关闭。</p>
            <div class="picker-actions">
                <span id="selection" role="status">尚未选择画面</span
                ><button id="cancel" class="secondary">取消</button
                ><button id="start" class="primary" disabled>共享此画面</button>
            </div>
        </footer>
    </body>
</html>
